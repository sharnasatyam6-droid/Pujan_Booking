name: Validate website code
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - run: for f in api/*.js js/*.js; do node --check "$f"; done
